[env:FSS-N01]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
lib_deps =
  bblanchon/ArduinoJson@^6.21.3
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D NODE_NAME=\"FSS-N01\"

